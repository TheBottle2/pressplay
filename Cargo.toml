[package]
name = "pressplay"
version = "0.2.0"
edition = "2021"
authors = ["TheBottle2"]

[dependencies]
evdev = "0.12"
nix = { version = "0.28", features = ["poll", "fs"] }
eframe = "0.27"
egui = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
crossbeam-channel = "0.5"
dirs = "5.0"
rfd = "0.14"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true